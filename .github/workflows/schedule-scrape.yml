name: Daily Scraping

on:
  schedule:
    # Runs every 24 hours at midnight UTC
    - cron: "0 0 * * *"

  workflow_dispatch: # Allows you to manually trigger the workflow
    inputs: {}

concurrency:
  group: daily-animal-sync
  cancel-in-progress: false

jobs:
  run-dog-scrape:
    runs-on: ubuntu-24.04

    steps:
      # Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install -r scraping/requirements.txt

      - name: Test scraper and HTTP requests
        run: python -m unittest discover -s scraping -p 'test_*.py'

      # Run the scraping script
      - name: Run Scraping
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          python scraping/dog_scrape.py
          python scraping/cat_scrape.py
